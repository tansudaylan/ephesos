[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephesos"
version = "1.13.0"
description = "Forward-modeling and light-curve synthesis tools for exoplanet astrophysics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "chalcedon",
  "numpy",
  "scipy",
  "matplotlib",
  "corner",
  "pillow",
  "astropy",
  "astroquery",
  "tqdm",
  "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed",
  "chalcedon"
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.4"]
plotting = ["miletos"]
ttv = ["ttvfast"]

[tool.setuptools.packages.find]
include = ["ephesos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.black]
line-length = 100
